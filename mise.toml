# Tools used locally and in CI, at the same versions. Renovate keeps them
# current (mise manager).

[tools]
opentofu = "1.13.9"
talosctl = "1.14.6"
kubectl = "1.37.2"
helm = "4.3.2"
flux2 = "2.10.0"
cilium-cli = "0.20.3"
uv = "0.13.8"
ruff = "0.17.5"
jq = "1.8.2"
shellcheck = "0.11.0"
"pipx:zensical" = "0.1.1"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.30.1"

[env]
# Cluster credentials, regenerated on demand and kept out of git (D30).
TALOSCONFIG = "{{config_root}}/talosconfig"
KUBECONFIG = "{{config_root}}/kubeconfig"
# The Kubernetes version of the cluster (D29); Renovate tracks the kubelet
# image of the same version.
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
KUBERNETES_VERSION = "1.36.6"

[tasks."docs:build"]
description = "build the documentation site into site/ (fails on warnings)"
run = "zensical build --clean --strict"

[tasks."docs:serve"]
description = "preview the documentation site locally"
run = "zensical serve"

[tasks."lint:python"]
description = "byte-compile and ruff check the tracked Python files"
run = [
  "git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile",
  "git ls-files -z '*.py' | xargs -0 -r ruff check --force-exclude",
]

[tasks."lint:tofu"]
description = "format check and validate infra/ (no backend, no credentials)"
dir = "infra"
run = [
  "tofu fmt -check -diff",
  "tofu init -backend=false -input=false >/dev/null",
  "tofu validate",
]

[tasks."lint:shell"]
description = "shellcheck the tracked shell scripts"
run = "git ls-files -z '*.sh' | xargs -0 -r shellcheck"

[tasks."lint:kubernetes"]
shell = "bash -c"
description = "build every kustomization under kubernetes/ and talos/ with kubectl kustomize (offline)"
run = '''
set -uo pipefail
fail=0
n=0
while IFS= read -r f; do
  d="$(dirname "$f")"
  n=$((n + 1))
  if ! err="$(kubectl kustomize "$d" 2>&1 >/dev/null)"; then
    printf 'FAIL %s\n%s\n' "$d" "$err" >&2
    fail=$((fail + 1))
  fi
done < <(git ls-files 'kubernetes/**kustomization.yaml' 'talos/**kustomization.yaml' | sort)
echo "kustomize: built $n directories, $fail failed"
[ "$fail" -eq 0 ]
'''

[tasks.check]
description = "everything that can be validated without a cluster, as CI runs it"
depends = ["docs:build", "lint:kubernetes", "lint:python", "lint:shell", "lint:tofu"]

# OpenTofu in infra/. Credentials are references in infra/op.env, resolved
# per command with the service account of vault homelab.
[tasks."infra:plan"]
shell = "bash -c"
description = "init and plan infra/ (the three nodes)"
dir = "infra"
run = '''
set -euo pipefail
token="$(op read op://dotfiles/homelab-op-service-account/credential)"
export OP_SERVICE_ACCOUNT_TOKEN="$token"
op run --env-file op.env -- tofu init -input=false >/dev/null
op run --env-file op.env -- tofu plan -input=false
'''

[tasks."infra:apply"]
shell = "bash -c"
description = "init and apply infra/ (asks for confirmation)"
dir = "infra"
run = '''
set -euo pipefail
token="$(op read op://dotfiles/homelab-op-service-account/credential)"
export OP_SERVICE_ACCOUNT_TOKEN="$token"
op run --env-file op.env -- tofu init -input=false >/dev/null
op run --env-file op.env -- tofu apply
'''

[tasks."infra:pool"]
shell = "bash -c"
description = "list the members of pool homelab with the tofu token"
run = '''
set -euo pipefail
token="$(op read op://dotfiles/homelab-op-service-account/credential)"
export OP_SERVICE_ACCOUNT_TOKEN="$token"
id="$(op read op://homelab/proxmox-tofu/username)"
secret="$(op read op://homelab/proxmox-tofu/credential)"
printf 'header = "Authorization: PVEAPIToken=%s=%s"\n' "$id" "$secret" |
  curl -sSfk -K - https://10.0.0.1:8006/api2/json/pools/homelab |
  jq -r '.data.members[] | [.type, (.vmid // .storage), (.name // "")] | @tsv'
'''

# The wildcard DNS record for the lab in Cloudflare (infra/dns/apply.py).
# Add --check to only report; the token is a reference in infra/dns/op.env.
[tasks."dns:apply"]
shell = "bash -c"
description = "ensure the Cloudflare record *.lab.savdert.com -> 10.0.6.20 (add --check to only report)"
dir = "infra/dns"
run = '''
set -euo pipefail
token="$(op read op://dotfiles/homelab-op-service-account/credential)"
export OP_SERVICE_ACCOUNT_TOKEN="$token"
# mise appends the task arguments (--check) to this last line.
op run --env-file op.env -- python3 -I apply.py
'''

# Talos machine configuration and nodes (talos/talos.sh). Arguments after the
# task name are passed on, e.g. `mise run talos:apply k8s-1 --insecure`.
[tasks."talos:secrets"]
description = "generate the cluster secrets once and store them in 1Password item talos"
run = "talos/talos.sh secrets"

[tasks."talos:render"]
description = "print the machine config of one node (contains secrets; pipe it, do not save it)"
run = "talos/talos.sh render"

[tasks."talos:apply"]
description = "apply the machine config to one node (add --insecure in maintenance mode)"
run = "talos/talos.sh apply"

[tasks."talos:config"]
description = "write the admin talosconfig from the stored secrets"
run = "talos/talos.sh config"

[tasks."talos:bootstrap"]
description = "bootstrap etcd on k8s-1 (once per cluster)"
run = "talos/talos.sh bootstrap"

[tasks."talos:kubeconfig"]
description = "write the admin kubeconfig from the cluster"
run = "talos/talos.sh kubeconfig"

[tasks."talos:upgrade"]
description = "upgrade one node to the installer image in talos/patches/cluster.yaml"
run = "talos/talos.sh upgrade"

[tasks."talos:schematic"]
description = "print the Image Factory ID of talos/schematic.yaml"
run = "talos/talos.sh schematic"

# Bootstrap order (D09): bootstrap:cilium, bootstrap:secrets, then
# bootstrap:flux, which waits for every Kustomization, including the
# 1Password store that needs the token bootstrap:secrets applies. The two
# Helm tasks install from the files Flux reconciles later, and Flux adopts
# the releases in place (D33 keeps the pod templates unchanged). Run them
# only on a cluster without Flux; afterwards Flux owns the releases and a
# Helm upgrade by hand fails on field conflicts.
[tasks."bootstrap:cilium"]
shell = "bash -c"
description = "install or upgrade Cilium with Helm from kubernetes/apps/kube-system/cilium/app"
dir = "kubernetes/apps/kube-system/cilium/app"
run = '''
set -euo pipefail
url="$(awk '$1 == "url:" {print $2}' ocirepository.yaml)"
tag="$(awk '$1 == "tag:" {print $2}' ocirepository.yaml)"
helm upgrade --install cilium "$url" --version "$tag" \
  --namespace kube-system --values values.yaml --wait --timeout 10m
'''

[tasks."bootstrap:secrets"]
shell = "bash -c"
description = "create namespace external-secrets and apply the 1Password token External Secrets reads vault homelab-cluster with"
run = '''
set -euo pipefail
token="$(op read op://dotfiles/homelab-op-service-account/credential)"
export OP_SERVICE_ACCOUNT_TOKEN="$token"
# Works before Flux exists: on a rebuild this runs between bootstrap:cilium
# and bootstrap:flux. Flux adopts the namespace later (namespace.yaml).
kubectl create namespace external-secrets --dry-run=client -o yaml |
  kubectl apply --server-side -f -
op inject -i bootstrap/external-secrets/secret.yaml | kubectl apply --server-side -f -
'''

[tasks."bootstrap:flux"]
shell = "bash -c"
description = "install flux-operator with Helm, then apply the FluxInstance and wait until Flux has adopted the releases"
dir = "kubernetes/apps/flux-system"
run = '''
set -euo pipefail
url="$(awk '$1 == "url:" {print $2}' flux-operator/app/ocirepository.yaml)"
tag="$(awk '$1 == "tag:" {print $2}' flux-operator/app/ocirepository.yaml)"
helm upgrade --install flux-operator "$url" --version "$tag" \
  --namespace flux-system --create-namespace --wait --timeout 10m
kubectl apply --server-side -f flux-instance/app/fluxinstance.yaml
kubectl -n flux-system wait fluxinstance/flux --for=condition=Ready --timeout=10m
kubectl -n flux-system wait kustomization/flux-system --for=condition=Ready --timeout=10m
# The task ends when Flux has adopted the two bootstrap releases.
kubectl -n flux-system wait kustomization --all --for=condition=Ready --timeout=10m
kubectl wait helmrelease --all --all-namespaces --for=condition=Ready --timeout=10m
'''
