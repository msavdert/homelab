---
# Phase 5 gate fixture: something to answer on https://echo.lab.savdert.com.
# Removed when a real application is served through the Gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: network
spec:
  # Two on different nodes (required anti-affinity), so a node reboot
  # leaves one running.
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: echo
      containers:
        - name: echo
          image: ghcr.io/mendhak/http-https-echo:43
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: network
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: network
spec:
  parentRefs:
    - name: lab
      sectionName: https
  hostnames:
    - echo.lab.savdert.com
  rules:
    - backendRefs:
        - name: echo
          port: 80
