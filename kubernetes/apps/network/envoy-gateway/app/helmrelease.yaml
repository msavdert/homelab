---
# Chart defaults. The CRDs (Gateway API and Envoy Gateway) are files in the
# crds/ directory of a subchart, which Helm applies on install only and
# helm-controller skips on upgrade by default; CreateReplace keeps them in
# step with the controller (D34).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
