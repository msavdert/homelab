---
# Homepage (D41). Ready when its Deployment is available.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
    # The HTTPRoute CRD and Gateway lab (D34).
    - name: envoy-gateway-gateway
    # Realm lab must exist before the first login redirect.
    - name: keycloak-realm-lab
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/homepage/homepage/app
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
