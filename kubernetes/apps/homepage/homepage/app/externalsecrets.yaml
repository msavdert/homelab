---
# Item homepage in vault homelab-cluster: auth-secret signs the session
# cookies, oidc-client-secret is the secret of Keycloak client homepage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  refreshInterval: 24h # D49: 1h used the 1Password daily request limit
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage
  data:
    - secretKey: auth-secret
      remoteRef:
        key: homepage/auth-secret
    - secretKey: oidc-client-secret
      remoteRef:
        key: homepage/oidc-client-secret
