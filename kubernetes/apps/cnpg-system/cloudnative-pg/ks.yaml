---
# The operator and its CRDs. wait makes this Ready only when the webhook
# answers, so the plugin and the database are applied after it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/cnpg-system/cloudnative-pg/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
