---
# Vault homelab-cluster, read with a read-only service account (D25). Its
# token is the Secret bootstrap:secrets applies; it is never in Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: homelab-cluster
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
