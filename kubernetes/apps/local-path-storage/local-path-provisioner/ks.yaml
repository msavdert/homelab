---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/local-path-storage/local-path-provisioner/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
