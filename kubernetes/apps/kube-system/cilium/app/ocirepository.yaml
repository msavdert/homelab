---
# The Cilium chart. bootstrap:cilium installs it from here with Helm; the
# HelmRelease next to it then adopts that release (D09).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.20.4
  url: oci://quay.io/cilium/charts/cilium
