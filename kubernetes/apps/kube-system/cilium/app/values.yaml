---
# Cilium on Talos with kube-proxy replacement (D08). The Talos-specific
# values follow the Talos guide "Deploying Cilium CNI".
ipam:
  mode: kubernetes
kubeProxyReplacement: true
# KubePrism, the API load balancer Talos runs on every node.
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# D26: a changed setting restarts the pods; Hubble off until phase 9.
rollOutCiliumPods: true
operator:
  rollOutPods: true
hubble:
  enabled: false
