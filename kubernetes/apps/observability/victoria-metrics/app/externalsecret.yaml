---
# Item grafana in vault homelab-cluster: the local admin login (the way in
# when Keycloak is down) and the secret of Keycloak client grafana (D43).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin-user
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin-password
    - secretKey: oidc-client-secret
      remoteRef:
        key: grafana/oidc-client-secret
