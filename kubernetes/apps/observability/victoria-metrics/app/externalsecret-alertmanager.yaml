---
# Item alertmanager in vault homelab-cluster renders Alertmanager's whole
# configuration (D47). Watchdog pings check homelab-watchdog on
# healthchecks.io; every other alert goes to receiver none until the
# Telegram receiver is added.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: none
            group_by: [alertname, namespace]
            routes:
              - matchers: ['alertname="Watchdog"']
                receiver: watchdog
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - matchers: ['severity=~"info|none"']
                receiver: none
          receivers:
            - name: none
            - name: watchdog
              webhook_configs:
                - url: "{{ .watchdogUrl }}"
                  send_resolved: false
  data:
    - secretKey: watchdogUrl
      remoteRef:
        key: alertmanager/watchdog-url
