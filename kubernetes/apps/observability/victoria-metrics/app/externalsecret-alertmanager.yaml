---
# Item alertmanager in vault homelab-cluster renders Alertmanager's whole
# configuration (D47). Watchdog pings check homelab-watchdog on
# healthchecks.io; alerts of severity info or none go nowhere; everything
# else goes to the owner's Telegram chat through the lab's own bot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 24h # D49: 1h used the 1Password daily request limit
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: telegram
            group_by: [alertname, namespace]
            routes:
              - matchers: ['alertname="Watchdog"']
                receiver: watchdog
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - matchers: ['severity=~"info|none"']
                receiver: none
          receivers:
            - name: none
            - name: watchdog
              webhook_configs:
                - url: "{{ .watchdogUrl }}"
                  send_resolved: false
            - name: telegram
              telegram_configs:
                - bot_token: "{{ .telegramBotToken }}"
                  chat_id: {{ .telegramChatId }}
                  send_resolved: true
  data:
    - secretKey: watchdogUrl
      remoteRef:
        key: alertmanager/watchdog-url
    - secretKey: telegramBotToken
      remoteRef:
        key: alertmanager/telegram-bot-token
    - secretKey: telegramChatId
      remoteRef:
        key: alertmanager/telegram-chat-id
