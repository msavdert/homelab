---
# grafana.lab.savdert.com through Gateway lab. Grafana's own login (OIDC
# against realm lab, D43) guards it. The gethomepage.dev annotations make
# Homepage list it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grafana
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: grafana.png
    gethomepage.dev/description: Metrics and dashboards
    gethomepage.dev/href: https://grafana.lab.savdert.com
    gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana,app.kubernetes.io/instance=vm
spec:
  parentRefs:
    - name: lab
      namespace: network
      sectionName: https
  hostnames:
    - grafana.lab.savdert.com
  rules:
    - backendRefs:
        - name: vm-grafana
          port: 80
