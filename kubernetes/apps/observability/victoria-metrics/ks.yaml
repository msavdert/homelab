---
# victoria-metrics-k8s-stack (D42): operator and CRDs, VMSingle, VMAgent,
# vmalert, kube-state-metrics, node-exporter, Grafana (D43).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
    # The HTTPRoute CRD and Gateway lab (D34).
    - name: envoy-gateway-gateway
    # Grafana's login redirects to realm lab (D43).
    - name: keycloak-realm-lab
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  path: ./kubernetes/apps/observability/victoria-metrics/app
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
