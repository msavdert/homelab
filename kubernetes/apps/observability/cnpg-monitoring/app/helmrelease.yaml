---
# The CloudNativePG dashboard as a ConfigMap labelled grafana_dashboard=1,
# which Grafana's sidecar loads. Its datasource variable picks the default
# Prometheus-type datasource, VictoriaMetrics.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-grafana-dashboards
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cnpg-grafana-dashboards
