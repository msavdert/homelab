---
# The two values the realm import needs, as keys of one Secret: the secret of
# client homepage (item homepage, the same value Homepage itself reads in its
# namespace) and the password of user owner (item keycloak-lab-user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realm-lab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: realm-lab
  data:
    - secretKey: homepage-client-secret
      remoteRef:
        key: homepage/oidc-client-secret
    - secretKey: owner-password
      remoteRef:
        key: keycloak-lab-user/password
