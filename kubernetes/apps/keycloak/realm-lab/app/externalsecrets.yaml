---
# The values the realm import needs, as keys of one Secret: the secret of
# client homepage (item homepage, the same value Homepage itself reads in its
# namespace), the secret of client grafana (item grafana, likewise) and the
# password of user owner (item keycloak-lab-user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realm-lab
spec:
  refreshInterval: 24h # D49: 1h used the 1Password daily request limit
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: realm-lab
  data:
    - secretKey: homepage-client-secret
      remoteRef:
        key: homepage/oidc-client-secret
    - secretKey: grafana-client-secret
      remoteRef:
        key: grafana/oidc-client-secret
    - secretKey: owner-password
      remoteRef:
        key: keycloak-lab-user/password
