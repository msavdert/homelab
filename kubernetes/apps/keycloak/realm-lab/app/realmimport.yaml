---
# Realm lab (D41). The operator imports only a realm that does not exist
# yet; a later edit of this file does not change the realm. Change it with
# kcadm.sh and write the change back here. Field names from the operator's
# CRD at 26.8.2. The ${...} values are filled by the import Job from Secret
# realm-lab (spec.placeholders).
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: lab
spec:
  keycloakCRName: keycloak
  # The import Job does not inherit the Keycloak resource's memory (D40);
  # without this it requests the operator default of 1700 MiB.
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi
  placeholders:
    HOMEPAGE_CLIENT_SECRET:
      secret:
        name: realm-lab
        key: homepage-client-secret
    GRAFANA_CLIENT_SECRET:
      secret:
        name: realm-lab
        key: grafana-client-secret
    OWNER_PASSWORD:
      secret:
        name: realm-lab
        key: owner-password
  realm:
    realm: lab
    enabled: true
    clients:
      - clientId: homepage
        name: Homepage
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        secret: "${HOMEPAGE_CLIENT_SECRET}"
        redirectUris:
          - https://home.lab.savdert.com/api/auth/callback/homepage-oidc
        webOrigins:
          - https://home.lab.savdert.com
        attributes:
          post.logout.redirect.uris: "https://home.lab.savdert.com/*"
      # Added on 2026-11-17 with kcadm.sh (D43); realm lab already existed.
      - clientId: grafana
        name: Grafana
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        secret: "${GRAFANA_CLIENT_SECRET}"
        redirectUris:
          - https://grafana.lab.savdert.com/login/generic_oauth
        webOrigins:
          - https://grafana.lab.savdert.com
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://grafana.lab.savdert.com/*"
    users:
      - username: owner
        enabled: true
        email: owner@lab.savdert.com
        emailVerified: true
        firstName: Lab
        lastName: Owner
        credentials:
          - type: password
            value: "${OWNER_PASSWORD}"
            temporary: false
