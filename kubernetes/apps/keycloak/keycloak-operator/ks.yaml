---
# The Keycloak Operator from its own kustomize resources at the release
# tag (D38). The tag pins the operator and, through the operator's
# RELATED_IMAGE_KEYCLOAK, the Keycloak image; Renovate's flux manager
# bumps it. Upstream sets namespace keycloak and watches only that
# namespace. The cluster-wide variant (preview) is not fetched.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/keycloak/keycloak-k8s-resources
  ref:
    tag: 26.8.2
  ignore: |
    /*
    !/kubernetes
    /kubernetes/cluster-wide
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: keycloak-operator
  patches:
    # Strategic-merge patches, so that keys a later upstream release adds
    # to these maps are kept.
    # Deleting these CRDs deletes every Keycloak resource (operator
    # installation docs), so Flux never prunes them.
    - target:
        kind: CustomResourceDefinition
      patch: |
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: all
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
    # The restricted pod security level; upstream sets no securityContext.
    - target:
        kind: Deployment
        name: keycloak-operator
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: keycloak-operator
        spec:
          template:
            spec:
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: keycloak-operator
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
