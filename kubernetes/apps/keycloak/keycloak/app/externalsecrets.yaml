---
# The bucket key for keycloak-db's backups, the same item cluster postgres
# uses (D25). Secrets do not cross namespaces, so it is delivered here too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-storage
spec:
  refreshInterval: 24h # D49: 1h used the 1Password daily request limit
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: object-storage
  data:
    - secretKey: access-key
      remoteRef:
        key: object-storage/access-key
    - secretKey: secret-key
      remoteRef:
        key: object-storage/secret-key
    - secretKey: region
      remoteRef:
        key: object-storage/region
    - secretKey: endpoint
      remoteRef:
        key: object-storage/endpoint
---
# Keycloak's bootstrap admin from item keycloak in vault homelab-cluster.
# The operator reads keys username and password (spec.bootstrapAdmin).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshInterval: 24h # D49: 1h used the 1Password daily request limit
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: keycloak-admin
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/username
    - secretKey: password
      remoteRef:
        key: keycloak/password
