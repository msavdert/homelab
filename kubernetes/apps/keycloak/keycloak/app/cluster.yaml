---
# Keycloak's own database cluster with the defaults of D39. The app user
# and database are both "app"; Keycloak reads them from keycloak-db-app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage:
    size: 5Gi
  # Review 2026-11-17 (V4): measured 24 h maximum working set 65 to 87 MiB
  # for the postgres container, under 20 millicores (VMSingle). Memory
  # request equals limit with room for shared_buffers (128 MB) and
  # maintenance work. Pod QoS is Burstable: no container sets a CPU
  # limit. Replicas restart first, then the primary by switchover.
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: object-storage
