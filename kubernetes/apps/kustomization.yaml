---
# Entry point of the cluster. The FluxInstance (flux-system/flux-instance)
# syncs this directory; every namespace directory is listed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cert-manager
  - ./external-secrets
  - ./flux-system
  - ./kube-system
  - ./network
