---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/flux-system/flux-operator/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
