---
# The flux-operator chart. bootstrap:flux installs it from here with Helm;
# the HelmRelease next to it then adopts that release.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.62.1
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
