---
# Flux itself. bootstrap:flux applies this file once; from then on Flux
# reconciles it from Git like everything else. The operator creates the
# GitRepository and Kustomization `flux-system` from spec.sync (D10: public
# repository, no credential, polling every minute by default).
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    # Never removed by pruning; removing Flux is a deliberate manual step.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    # Exact version, kept current by Renovate (custom manager).
    # renovate: datasource=github-releases depName=fluxcd/flux2
    version: 2.10.0
    registry: ghcr.io/fluxcd
  sync:
    kind: GitRepository
    url: https://github.com/msavdert/homelab.git
    ref: refs/heads/main
    path: kubernetes/apps
  kustomize:
    patches:
      # helm-controller otherwise appends the digest of the OCI artifact to
      # the chart version (1.20.4+712e1f65bf30). Charts that put the chart
      # version in a pod label (helm.sh/chart: Cilium, flux-operator) would
      # then roll every pod when Flux adopts a release installed by
      # bootstrap, and again whenever a tag is pushed anew (D33).
      - target:
          kind: Deployment
          name: helm-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=DisableChartDigestTracking=true
