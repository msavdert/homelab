---
# cert-manager and its CRDs. wait makes this Kustomization Ready only when
# the HelmRelease is, so the issuers are applied after the CRDs and the
# webhook exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/cert-manager/cert-manager/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# The Cloudflare token and the ClusterIssuer that uses it. Ready only when
# the token has synced and the ACME account is registered.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: external-secrets-stores
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/cert-manager/cert-manager/issuers
  prune: true
  wait: true
  # Same reasoning as external-secrets-stores: no `failed` expression,
  # exists() instead of all().
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
