---
# The Cloudflare token for DNS-01 (DNS edit on savdert.com only), read from
# vault homelab-cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns
  namespace: cert-manager
spec:
  refreshInterval: 24h # D49: 1h used the 1Password daily request limit
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-dns
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-dns/credential
