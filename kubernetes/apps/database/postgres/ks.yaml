---
# Cluster postgres with its backups (D27). Ready only when the Cluster
# reports healthy and the bucket credentials have synced.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
    - name: local-path-provisioner
    - name: plugin-barman-cloud
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  path: ./kubernetes/apps/database/postgres/app
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
