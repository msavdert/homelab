---
# Where cluster postgres keeps base backups and WAL: s3://homelab/cnpg/postgres/
# (D24, D27). Field names from the plugin's API types at v0.16.0.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: object-storage
spec:
  # Temporarily 1d for follow-up 6b of phase 7 (D37): the plugin's own
  # retention must remove an expired backup, which with 7d (D27) would take
  # eight days. Back to 7d once the bucket shows the removal.
  retentionPolicy: 1d
  configuration:
    destinationPath: s3://homelab/cnpg/
    s3AddressingStyle: path
    s3Credentials:
      accessKeyId:
        name: object-storage
        key: access-key
      secretAccessKey:
        name: object-storage
        key: secret-key
      region:
        name: object-storage
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
  # The sidecar reads env only when an instance pod is created (plugin
  # issue #918); after a change here, run `kubectl cnpg restart`.
  instanceSidecarConfiguration:
    env:
      # boto3 reads the endpoint from here when endpointURL is unset.
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef:
            name: object-storage
            key: endpoint
      # The setting the plugin documents for S3-compatible stores.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
