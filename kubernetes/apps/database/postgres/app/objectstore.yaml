---
# Where cluster postgres keeps base backups and WAL: s3://homelab/cnpg/postgres/
# (D24, D27). Field names from the plugin's API types at v0.16.0.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: object-storage
spec:
  # D27. Follow-up 6b (D37) ran with 1d and saw the plugin's own
  # retention remove an expired backup on 2026-11-19.
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://homelab/cnpg/
    s3AddressingStyle: path
    s3Credentials:
      accessKeyId:
        name: object-storage
        key: access-key
      secretAccessKey:
        name: object-storage
        key: secret-key
      region:
        name: object-storage
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
  # The sidecar reads env only when an instance pod is created (plugin
  # issue #918); after a change here, run `kubectl cnpg restart`.
  # Measured 2026-11-17: 16 MiB idle, 62 MiB during a backup, under 10
  # millicores. Like env, read only when an instance pod is created.
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
    env:
      # boto3 reads the endpoint from here when endpointURL is unset.
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef:
            name: object-storage
            key: endpoint
      # The setting the plugin documents for S3-compatible stores.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
