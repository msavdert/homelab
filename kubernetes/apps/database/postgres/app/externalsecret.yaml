---
# The key that reaches only bucket homelab, from vault homelab-cluster
# (D25). The endpoint carries the tenancy namespace, so it stays out of
# this public repository and reaches the sidecar as an environment variable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-storage
spec:
  refreshInterval: 24h # D49: 1h used the 1Password daily request limit
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: object-storage
  data:
    - secretKey: access-key
      remoteRef:
        key: object-storage/access-key
    - secretKey: secret-key
      remoteRef:
        key: object-storage/secret-key
    - secretKey: region
      remoteRef:
        key: object-storage/region
    - secretKey: endpoint
      remoteRef:
        key: object-storage/endpoint
