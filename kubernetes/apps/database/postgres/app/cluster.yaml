---
# The parameters fixed in D27. The minimal image: Barman runs in the
# plugin's sidecar, so the deprecated system image (the operator default)
# is not needed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage:
    size: 10Gi
  # Review 2026-11-17 (V4): measured 24 h maximum working set 65 to 87 MiB
  # for the postgres container, under 20 millicores (VMSingle). Memory
  # request equals limit with room for shared_buffers (128 MB) and
  # maintenance work. Pod QoS is Burstable: no container sets a CPU
  # limit. Replicas restart first, then the primary by switchover.
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: object-storage
