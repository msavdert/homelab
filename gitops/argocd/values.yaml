# Helm values for the argo/argo-cd chart, version 10.2.2 (app v3.4.6).
#
# Used both for the initial day-0 `helm install` bootstrap (ADR-0007) and,
# once ArgoCD is running, by its own self-referencing Application
# (../apps/argocd.yaml) so subsequent changes flow through GitOps.
#
# No ingress/TLS config here yet — that's a separate pending Phase 1 item
# (see docs/PLAN.md). Until it lands, reach the UI/API via
# `kubectl -n argocd port-forward svc/argocd-server 8080:443`.
#
# repoServer.* and configs.cm.* below wire in KSOPS (ADR-0009) so
# SOPS-encrypted manifests can be decrypted at sync time: an init container
# installs the ksops/kustomize binaries built into the viaductoss/ksops
# image onto the repo-server, and the age private key is mounted from a
# `sops-age` Secret (key: key.txt) that pre-exists in the argocd namespace —
# created imperatively per ADR-0009, never committed to git.
#
# server.ingress.* + configs.params below wire in Ingress+TLS (ADR-0010):
# the server runs in `insecure` (plain HTTP) mode internally, and TLS is
# terminated at the Cilium Ingress using a cert-manager-issued certificate
# from the cluster's private CA (`homelab-ca-issuer`). Reach the UI at
# https://argocd.homelab.internal — requires a local `/etc/hosts` entry
# pointing that name at k3s-node-01 (10.0.1.10) and trusting `homelab-ca`
# once, since there's no tailnet-wide DNS or public CA yet.

crds:
  install: true

redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: cilium
    hostname: argocd.homelab.internal
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer

configs:
  cm:
    # Required for ArgoCD to invoke kustomize's ksops exec plugin.
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
  params:
    # TLS is terminated at the Ingress (cert-manager cert), so the server
    # itself serves plain HTTP/gRPC internally.
    server.insecure: true

repoServer:
  replicas: 1
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
        items:
          - key: key.txt
            path: keys.txt
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
      readOnly: true

applicationSet:
  enabled: true

notifications:
  enabled: false
