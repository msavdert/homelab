---
# Rendered by bootstrap:secrets with op inject; the value never touches
# disk. The token belongs to the read-only service account of vault
# homelab-cluster (D25) and is kept in vault homelab.
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-service-account
  namespace: external-secrets
type: Opaque
stringData:
  token: "{{ op://homelab/eso-service-account/credential }}"
