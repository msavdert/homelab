# Applies to every node.
# The installer must be the nocloud one: the platform is part of the image,
# and the metal installer would drop the addresses that come from cloud-init.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/nocloud-installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.14.6
---
# Cilium replaces flannel (D08).
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# The data disk (D14): a partition over the whole second disk, XFS, mounted
# at /var/mnt/local-path-provisioner, where local-path-provisioner keeps its
# volumes. The selector names no device path, which can change between
# boots; a disk qualifies only with room for minSize, which the 4 MB
# cloud-init CD-ROM does not have.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
provisioning:
  diskSelector:
    match: "!system_disk"
  minSize: 50GB
